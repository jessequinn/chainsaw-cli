name: Chainsaw Supply Chain Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build chainsaw
        run: go build -o chainsaw ./cmd/chainsaw

      - name: Scan dependencies (SARIF)
        run: |
          ./chainsaw scan --format sarif --policy .chainsaw.yaml --quiet . > results.sarif || true
          if [ ! -s results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"chainsaw","version":"0.4.0"}},"results":[]}]}' > results.sarif
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        if: always()

      - name: Unified compliance check
        run: ./chainsaw check --format json --policy .chainsaw.yaml --quiet --output check-results.json .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chainsaw-results
          path: |
            results.sarif
            check-results.json
