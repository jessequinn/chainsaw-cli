name: Chainsaw Supply Chain Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install chainsaw
        run: go install github.com/chainsaw-dev/chainsaw/cmd/chainsaw@latest

      - name: Scan dependencies
        run: chainsaw scan --format sarif --fail-on HIGH --policy .chainsaw.yaml > results.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: always()

      - name: CRA compliance check
        run: chainsaw comply --format json --policy .chainsaw.yaml > compliance.json

      - name: Supply chain analysis
        run: chainsaw supply-chain --format json > supply-chain.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-results
          path: |
            results.sarif
            compliance.json
            supply-chain.json
