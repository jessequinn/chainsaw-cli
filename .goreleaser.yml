version: 2

project_name: chainsaw

builds:
  - id: chainsaw
    main: ./cmd/chainsaw
    binary: chainsaw
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "chainsaw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

source:
  enabled: true
  name_template: "chainsaw-{{ .Version }}-source"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: chainsaw-dev
    name: chainsaw
  draft: false
  prerelease: auto
