version: 2

project_name: chainsaw

builds:
  - id: chainsaw
    main: ./cmd/chainsaw
    binary: chainsaw
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "chainsaw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

source:
  enabled: true
  name_template: "chainsaw-{{ .Version }}-source"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: chainsaw
    repository:
      owner: jessequinn
      name: homebrew-chainsaw
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/jessequinn/chainsaw-cli"
    description: "Supply chain security scanner for CRA compliance"
    binaries:
      - chainsaw
    generate_completions_from_executable:
      executable: "bin/chainsaw"
      args:
        - completion
      shell_parameter_format: cobra
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/chainsaw"]
          end
changelog:
  disable: true

release:
  github:
    owner: jessequinn
    name: chainsaw-cli
  draft: false
  prerelease: auto
